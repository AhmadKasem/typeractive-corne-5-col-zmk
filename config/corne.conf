# Enable deep sleep — MCU enters nRF52840 System OFF when keyboard is idle
CONFIG_ZMK_SLEEP=y

# Enter idle (display off, reduced BLE) after 10s of no input. Default: 30000
CONFIG_ZMK_IDLE_TIMEOUT=10000

# Enter deep sleep 20 min after idle. Only effective with CONFIG_ZMK_SLEEP=y. Default: 900000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Request shorter BLE connection interval from host (7.5-11.25ms) to reduce input latency
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y

# Enable mouse keys
CONFIG_ZMK_MOUSE=y

